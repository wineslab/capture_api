version: '3.8'

services:
  flask:
    build:
      context: ./flask
    container_name: flask-service
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /tmp/captures:/app/captures
    environment:
      - FLASK_ENV=production
      - SWITCH_IP=10.101.1.2
      - SWITCH_USERNAME=opsmon
      - SWITCH_PASSWORD=0p@M0n*tor
  capture-ui:
    build:
      context: ./capture-ui
    container_name: capture-ui
    environment:
      - REACT_APP_API_HOST=otic-kvm-02.colosseum.net
    ports:
      - "80:80"
    volumes:
      - /tmp/captures:/usr/share/nginx/html/captures:ro
